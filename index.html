<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Heading font: Futura, matching Loan Theory's brand heading font.
    True Futura isn't a web font, so this stack uses the real thing on Apple
    devices (it ships with macOS/iOS) and falls back to Century Gothic
    elsewhere, which is the closest common match. Body text stays in Karla
    (a plain geometric sans) for readability, the same way Loan Theory pairs
    a Futura heading with a Proxima Nova body.
  */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --panel-tint:#FFF4FA;
    --hairline:#FFD3E9;
    --hot:#FF1493;
    --hot-soft:#FFB6DA;
    --hot-pale:#FFE6F3;
    --btn-text:#FFEAF3;
    --text:#332B31;
    --text-dim:#9C7E90;
    --danger:#D6336C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Karla', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:36px 20px 60px;
  }
  header{
    margin-bottom:22px;
  }
  h1{
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:-0.01em;
    font-size:32px;
    margin:0 0 6px;
    color:var(--hot);
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0;
  }
  .today-line{
    font-size:12px;
    color:var(--text-dim);
    margin:6px 0 0;
  }
  section{
    margin-top:34px;
  }
  h2{
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    font-weight:700;
    font-size:16px;
    margin:0 0 14px;
    color:var(--hot);
  }
  .divider{
    border:none;
    border-top:1px solid var(--hairline);
    margin:34px 0 0;
  }

  /* --- Add form --- */
  .form-panel{
    background:var(--panel-tint);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:18px;
  }

  /* Start/stop timer */
  .timer-box{
    text-align:center;
    padding:6px 0 4px;
  }
  .timer-status{
    font-size:13px;
    color:var(--text-dim);
    min-height:18px;
    margin-bottom:10px;
  }
  .timer-status .elapsed{
    color:var(--hot);
    font-weight:700;
  }
  button.timer-btn{
    width:100%;
    background:var(--hot);
    color:var(--btn-text);
    border:none;
    border-radius:12px;
    padding:18px;
    font-size:17px;
    font-weight:700;
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    letter-spacing:0.01em;
    cursor:pointer;
  }
  button.timer-btn.stopping{
    background:var(--danger);
  }
  button.timer-btn:active{ opacity:0.85; }
  button.timer-btn:disabled{ opacity:0.5; cursor:default; }

  .manual-toggle{
    display:block;
    margin:14px auto 0;
    background:none;
    border:none;
    color:var(--hot);
    font-size:13px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  .manual-panel{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--hairline);
  }
  .manual-panel.hidden{ display:none; }
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field.full{
    grid-column:1 / -1;
  }
  label{
    font-size:12px;
    color:var(--text-dim);
  }
  input[type=date], input[type=time]{
    background:#FFFFFF;
    border:1px solid var(--hairline);
    border-radius:9px;
    color:var(--text);
    padding:10px 10px;
    font-family:'Karla',sans-serif;
    font-size:15px;
    width:100%;
  }
  input:focus{
    outline:2px solid var(--hot);
    outline-offset:1px;
  }
  .hint{
    font-size:12px;
    color:var(--text-dim);
    margin:2px 0 12px;
  }
  button.add{
    width:100%;
    background:var(--hot);
    color:var(--btn-text);
    border:none;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    cursor:pointer;
  }
  button.add:active{ opacity:0.85; }
  button.add:disabled{ opacity:0.5; cursor:default; }
  .form-msg{
    font-size:13px;
    margin-top:10px;
    color:var(--danger);
    min-height:16px;
  }

  /* --- Chart --- */
  .chart-scale{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-dim);
    padding-left:78px;
    margin-bottom:8px;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .day-label{
    width:68px;
    flex-shrink:0;
    font-size:13px;
    line-height:1.25;
    color:var(--text-dim);
  }
  .day-label .dow{
    color:var(--hot);
    font-weight:700;
    display:block;
  }
  .track{
    position:relative;
    flex:1;
    height:26px;
    background:var(--hot-pale);
    border-radius:6px;
    overflow:hidden;
  }
  .seg{
    position:absolute;
    top:0;
    bottom:0;
    background:var(--hot);
  }
  .track-tick{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,20,147,0.15);
  }
  .day-total{
    width:56px;
    flex-shrink:0;
    text-align:right;
    font-size:12px;
    color:var(--text-dim);
  }
  .week-label{
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-dim);
    margin:18px 0 8px;
  }
  .week-label:first-child{ margin-top:0; }
  .day-row.future .track,
  .day-row.future .day-label,
  .day-row.future .day-total{
    opacity:0.45;
  }
  .day-row.today .day-label .dow{
    text-decoration:underline;
    text-decoration-color:var(--hot);
  }
  .chart-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .load-more{
    flex:1;
    display:block;
    width:100%;
    background:none;
    border:1px solid var(--hairline);
    color:var(--hot);
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px;
    border-radius:9px;
    cursor:pointer;
  }
  .load-more:active{ background:var(--hot-pale); }
  .load-more.show-less{
    color:var(--text-dim);
    border-color:var(--hairline);
    flex:0 0 auto;
    padding-left:16px;
    padding-right:16px;
  }
  .legend{
    display:flex;
    gap:18px;
    margin-top:14px;
    font-size:12px;
    color:var(--text-dim);
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .swatch{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .swatch.asleep{ background:var(--hot); }
  .swatch.awake{ background:var(--hot-pale); border:1px solid var(--hairline); }

  .empty{
    color:var(--text-dim);
    font-size:14px;
    padding:20px 0;
  }
  .loading{
    color:var(--text-dim);
    font-size:14px;
  }

  /* --- Trends --- */
  .trend-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .trend-stat{
    background:var(--panel-tint);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:12px 14px;
  }
  .trend-label{
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  .trend-value{
    font-family:'Futura', 'Century Gothic', 'Karla', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--hot);
  }
  .trend-delta{
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .trend-note{
    grid-column:1 / -1;
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }

  /* --- Session list --- */
  .day-group{
    margin-bottom:10px;
    border:1px solid var(--hairline);
    border-radius:10px;
    overflow:hidden;
  }
  .day-group-title{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:var(--text-dim);
    background:var(--panel-tint);
    border:none;
    padding:12px 14px;
    font-family:'Karla',sans-serif;
    cursor:pointer;
    text-align:left;
  }
  .day-group-title .dow{ color:var(--hot); font-weight:700; }
  .day-group-title .dgt-left{ display:flex; align-items:baseline; gap:5px; }
  .day-group-title .dgt-right{ display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12px; }
  .day-group-title .chevron{
    display:inline-block;
    transition:transform 0.15s ease;
    color:var(--hot);
    font-size:11px;
  }
  .day-group.open .chevron{ transform:rotate(90deg); }
  .day-entries{
    padding:10px 12px 12px;
  }
  .day-entries.hidden{ display:none; }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#FFFFFF;
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:11px 12px;
    margin-bottom:7px;
  }
  .entry:last-child{ margin-bottom:0; }
  .entry-time{
    font-size:14px;
  }
  .entry-dur{
    color:var(--text-dim);
    font-size:12px;
    margin-top:2px;
  }
  .del{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:18px;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }
  .del:active{ color:var(--danger); }

  .status-note{
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }
</style>

<!-- Firebase (compat SDK, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>

<body>
<div class="wrap">

  <header>
    <h1>Sleep Log</h1>
    <p class="sub">Log each stretch of sleep. The chart fills in pink for asleep, pale for awake, one row per day.</p>
    <p class="today-line" id="today-line"></p>
  </header>

  <div class="form-panel">
    <h2>Add a sleep period</h2>

    <div class="timer-box">
      <div class="timer-status" id="timer-status"></div>
      <button class="timer-btn" id="timer-btn">Start sleep</button>
    </div>

    <button class="manual-toggle" id="manual-toggle" type="button">+ Add manually instead</button>

    <div class="manual-panel hidden" id="manual-panel">
      <div class="form-row">
        <div class="field">
          <label for="m-start-date">Date fell asleep</label>
          <input type="date" id="m-start-date">
        </div>
        <div class="field">
          <label for="m-start-time">Fell asleep</label>
          <input type="time" id="m-start-time">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="m-end-date">Date woke up</label>
          <input type="date" id="m-end-date">
        </div>
        <div class="field">
          <label for="m-end-time">Woke up</label>
          <input type="time" id="m-end-time">
        </div>
      </div>
      <button class="add" id="add-btn">Add sleep period</button>
      <div class="form-msg" id="form-msg"></div>
    </div>
  </div>

  <section>
    <h2>Sleep chart</h2>
    <div id="chart-area"><div class="loading">Loading…</div></div>
    <div class="legend">
      <span><i class="swatch asleep"></i> Asleep</span>
      <span><i class="swatch awake"></i> Awake</span>
    </div>
  </section>

  <section>
    <h2>Last 7 days</h2>
    <div id="trends-area"><div class="loading">Loading…</div></div>
  </section>

  <hr class="divider">

  <section>
    <h2>All entries</h2>
    <div id="list-area"><div class="loading">Loading…</div></div>
  </section>

</div>

function pad(n){ return String(n).padStart(2,'0'); }

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function nowISO(){
  // Local date/time, always computed fresh so it's correct even if the
  // page has been open since before midnight.
  const d = new Date();
  return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function renderTodayLine(){
  const el = $('today-line');
  if(!el) return;
  const d = new Date();
  el.textContent = 'Today is ' + d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
}

function fmtTime(hh, mm){
  const h12 = ((hh % 12) || 12);
  const ampm = hh < 12 ? 'am' : 'pm';
  return `${h12}:${pad(mm)}${ampm}`;
}

function fmtDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = dt.toLocaleDateString(undefined,{weekday:'short'});
  const md = dt.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  return {dow, md};
}

function minutesOfDay(hh, mm){ return hh*60 + mm; }

function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

async function loadSessions(){
  try{
    const snap = await sessionsDocRef.get();
    const d = snap.exists ? snap.data() : {};
    sessions = d.data ? JSON.parse(d.data) : [];
    activeSession = d.active ? JSON.parse(d.active) : null;
  }catch(e){
    console.error(e);
    chartArea.innerHTML = '<div class="empty">Could not connect to the database. Check the Firebase config and internet connection.</div>';
    listArea.innerHTML = '';
    return;
  }
  if(sessions.length === 0){
    sessions = SEED_SESSIONS.slice();
    await saveState();
  }
  storageReady = true;
  render();
  renderTimerUI();

  // Live updates: if the other parent starts/stops sleep or adds an entry,
  // refresh without reloading.
  sessionsDocRef.onSnapshot((snap) => {
    if(!snap.exists) return;
    const d = snap.data();
    const incomingSessions = d.data ? JSON.parse(d.data) : [];
    const incomingActive = d.active ? JSON.parse(d.active) : null;
    if(JSON.stringify(incomingSessions) !== JSON.stringify(sessions)){
      sessions = incomingSessions;
      render();
    }
    if(JSON.stringify(incomingActive) !== JSON.stringify(activeSession)){
      activeSession = incomingActive;
      renderTimerUI();
    }
  });
}

async function saveState(){
  // Always write sessions + active together in one call, never separately.
  // Two separate writes created a window where the other tab could read a
  // half-updated document (new sessions, stale active flag) and think a
  // finished sleep was still running.
  try{
    await sessionsDocRef.set({
      data: JSON.stringify(sessions),
      active: activeSession ? JSON.stringify(activeSession) : null,
      updatedAt: Date.now()
    }, {merge: true});
    return true;
  }catch(e){
    console.error(e);
    formMsg.textContent = "Couldn't save — check your connection and try again.";
    return false;
  }
}

function computeDuration(startISO, endISO){
  const mins = Math.round((new Date(endISO) - new Date(startISO)) / 60000);
  const h = Math.floor(mins/60), m = mins % 60;
  return {mins, text: `${h}h ${pad(m)}m`};
}

function makeId(){ return Date.now()+'-'+Math.random().toString(36).slice(2); }

async function addManualSession(){
  const startDate = $('m-start-date').value;
  const startTime = $('m-start-time').value;
  const endDate = $('m-end-date').value;
  const endTime = $('m-end-time').value;
  formMsg.textContent = '';

  if(!startDate || !startTime || !endDate || !endTime){
    formMsg.textContent = 'Fill in both dates and both times.';
    return;
  }

  const startISO = `${startDate}T${startTime}:00`;
  const endISO = `${endDate}T${endTime}:00`;

  if(new Date(endISO) <= new Date(startISO)){
    formMsg.textContent = 'Woke up time must be after fell asleep time.';
    return;
  }
  if(new Date(endISO) - new Date(startISO) > 20*60*60000){
    formMsg.textContent = "That's over 20 hours — double check the dates and times.";
    return;
  }

  const btn = $('add-btn');
  btn.disabled = true;
  sessions.push({ id: makeId(), startISO, endISO });
  sessions.sort((a,b) => new Date(a.startISO) - new Date(b.startISO));
  const ok = await saveState();
  btn.disabled = false;
  if(ok){
    render();
    resetManualForm();
  }
}

function resetManualForm(){
  const today = todayStr();
  $('m-start-date').value = today;
  $('m-end-date').value = today;
  $('m-start-time').value = '';
  $('m-end-time').value = '';
}

async function deleteSession(id){
  sessions = sessions.filter(s => s.id !== id);
  await saveState();
  render();
}

// ---- Start/stop sleep timer ----

async function startSleep(){
  const btn = $('timer-btn');
  btn.disabled = true;
  activeSession = { startISO: nowISO() };
  await saveState();
  btn.disabled = false;
  renderTimerUI();
}

async function stopSleep(){
  if(!activeSession) return;
  const btn = $('timer-btn');
  btn.disabled = true;
  const endISO = nowISO();
  sessions.push({ id: makeId(), startISO: activeSession.startISO, endISO });
  sessions.sort((a,b) => new Date(a.startISO) - new Date(b.startISO));
  activeSession = null;
  await saveState();
  btn.disabled = false;
  render();
  renderTimerUI();
}

function renderTimerUI(){
  const btn = $('timer-btn');
  const status = $('timer-status');
  if(elapsedInterval){ clearInterval(elapsedInterval); elapsedInterval = null; }

  if(activeSession){
    btn.textContent = 'Stop sleep';
    btn.classList.add('stopping');
    const updateElapsed = () => {
      const dur = computeDuration(activeSession.startISO, nowISO());
      const st = new Date(activeSession.startISO);
      status.innerHTML = `Asleep since ${fmtTime(st.getHours(), st.getMinutes())} &middot; <span class="elapsed">${dur.text}</span>`;
    };
    updateElapsed();
    elapsedInterval = setInterval(updateElapsed, 30000);
  }else{
    btn.textContent = 'Start sleep';
    btn.classList.remove('stopping');
    status.textContent = '';
  }
}

let weeksLoaded = 1; // how many week blocks are currently shown in the chart

function sundayOf(dateStr){
  // Returns the YYYY-MM-DD of the Sunday starting that date's week.
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() - dt.getDay()); // getDay(): 0 = Sunday
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function weekDates(weeksBack){
  // The 7 date strings (Sunday..Saturday) for the week `weeksBack` weeks
  // before the current week (0 = this week).
  const thisSunday = sundayOf(todayStr());
  const start = addDays(thisSunday, -7 * weeksBack);
  const out = [];
  for(let i=0;i<7;i++) out.push(addDays(start, i));
  return out;
}

function fmtWeekRange(sundayStr){
  const satStr = addDays(sundayStr, 6);
  return `${fmtDateLabel(sundayStr).md} – ${fmtDateLabel(satStr).md}`;
}

function segmentsForDay(dateStr){
  const dayStart = new Date(`${dateStr}T00:00:00`);
  const dayEnd = new Date(`${addDays(dateStr,1)}T00:00:00`);
  const segs = [];
  sessions.forEach(s => {
    const st = new Date(s.startISO), en = new Date(s.endISO);
    const clipStart = st < dayStart ? dayStart : st;
    const clipEnd = en > dayEnd ? dayEnd : en;
    if(clipEnd > clipStart){
      const startMin = (clipStart - dayStart) / 60000;
      const endMin = (clipEnd - dayStart) / 60000;
      segs.push({startMin, endMin});
    }
  });
  return segs;
}

function buildDayRow(dateStr){
  const {dow, md} = fmtDateLabel(dateStr);
  const segs = segmentsForDay(dateStr);
  const totalMins = segs.reduce((sum,s) => sum + (s.endMin - s.startMin), 0);
  const h = Math.floor(totalMins/60), m = Math.round(totalMins%60);
  const isFuture = dateStr > todayStr();
  const isToday = dateStr === todayStr();

  const row = document.createElement('div');
  row.className = 'day-row' + (isFuture ? ' future' : '') + (isToday ? ' today' : '');

  const label = document.createElement('div');
  label.className = 'day-label';
  label.innerHTML = `<span class="dow">${dow}</span>${md}`;

  const track = document.createElement('div');
  track.className = 'track';
  [6,12,18].forEach(hr => {
    const tick = document.createElement('div');
    tick.className = 'track-tick';
    tick.style.left = (hr/24*100)+'%';
    track.appendChild(tick);
  });
  segs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'seg';
    el.style.left = (s.startMin/1440*100)+'%';
    el.style.width = ((s.endMin - s.startMin)/1440*100)+'%';
    track.appendChild(el);
  });

  const total = document.createElement('div');
  total.className = 'day-total';
  total.textContent = totalMins > 0 ? `${h}h ${pad(m)}m` : '';

  row.appendChild(label);
  row.appendChild(track);
  row.appendChild(total);
  return row;
}

function renderChart(){
  const scale = document.createElement('div');
  scale.className = 'chart-scale';
  ['12am','6am','12pm','6pm','12am'].forEach(t => {
    const s = document.createElement('span');
    s.textContent = t;
    scale.appendChild(s);
  });

  const rows = document.createElement('div');

  for(let w = 0; w < weeksLoaded; w++){
    const dates = weekDates(w);
    const weekLabel = document.createElement('div');
    weekLabel.className = 'week-label';
    weekLabel.textContent = (w === 0) ? 'This week' : fmtWeekRange(dates[0]);
    rows.appendChild(weekLabel);

    // Most recent day first within the week, so today sits near the top.
    dates.slice().reverse().forEach(dateStr => {
      rows.appendChild(buildDayRow(dateStr));
    });
  }

  const actions = document.createElement('div');
  actions.className = 'chart-actions';

  if(weeksLoaded > 1){
    const showLessBtn = document.createElement('button');
    showLessBtn.type = 'button';
    showLessBtn.className = 'load-more show-less';
    showLessBtn.textContent = 'Show less';
    showLessBtn.addEventListener('click', () => {
      weeksLoaded--;
      renderChart();
    });
    actions.appendChild(showLessBtn);
  }

  const loadMoreBtn = document.createElement('button');
  loadMoreBtn.type = 'button';
  loadMoreBtn.className = 'load-more';
  loadMoreBtn.textContent = 'Load previous week';
  loadMoreBtn.addEventListener('click', () => {
    weeksLoaded++;
    renderChart();
  });
  actions.appendChild(loadMoreBtn);

  chartArea.innerHTML = '';
  chartArea.appendChild(scale);
  chartArea.appendChild(rows);
  chartArea.appendChild(actions);
}

let expandedDays = null; // Set of date strings currently expanded; null = not yet initialized

function renderList(){
  if(sessions.length === 0){
    listArea.innerHTML = '<div class="empty">Nothing logged yet.</div>';
    return;
  }
  const byDay = {};
  sessions.forEach(s => {
    const d = s.startISO.slice(0,10);
    if(!byDay[d]) byDay[d] = [];
    byDay[d].push(s);
  });
  const dayKeys = Object.keys(byDay).sort().reverse();

  if(expandedDays === null){
    expandedDays = new Set();
    if(dayKeys.length) expandedDays.add(dayKeys[0]); // most recent day open by default
  }

  listArea.innerHTML = '';
  dayKeys.forEach(dateStr => {
    const {dow, md} = fmtDateLabel(dateStr);
    const dayEntries = byDay[dateStr].sort((a,b) => new Date(a.startISO) - new Date(b.startISO));
    const dayTotalMins = dayEntries.reduce((sum, s) => sum + computeDuration(s.startISO, s.endISO).mins, 0);
    const dh = Math.floor(dayTotalMins/60), dm = dayTotalMins % 60;
    const isOpen = expandedDays.has(dateStr);

    const group = document.createElement('div');
    group.className = 'day-group' + (isOpen ? ' open' : '');

    const title = document.createElement('button');
    title.type = 'button';
    title.className = 'day-group-title';
    title.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    title.innerHTML = `
      <span class="dgt-left"><span class="dow">${dow}</span> ${md}</span>
      <span class="dgt-right">${dayEntries.length} ${dayEntries.length === 1 ? 'entry' : 'entries'} &middot; ${dh}h ${pad(dm)}m <span class="chevron">&#9656;</span></span>
    `;
    title.addEventListener('click', () => {
      if(expandedDays.has(dateStr)){ expandedDays.delete(dateStr); } else { expandedDays.add(dateStr); }
      renderList();
    });

    const entriesWrap = document.createElement('div');
    entriesWrap.className = 'day-entries' + (isOpen ? '' : ' hidden');

    dayEntries.forEach(s => {
      const st = new Date(s.startISO), en = new Date(s.endISO);
      const dur = computeDuration(s.startISO, s.endISO);
      const crossesDay = s.startISO.slice(0,10) !== s.endISO.slice(0,10);

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div>
          <div class="entry-time">${fmtTime(st.getHours(), st.getMinutes())} &ndash; ${fmtTime(en.getHours(), en.getMinutes())}${crossesDay ? ' (+1 day)' : ''}</div>
          <div class="entry-dur">${dur.text} asleep</div>
        </div>
        <button class="del" aria-label="Delete entry" data-id="${s.id}">&times;</button>
      `;
      entriesWrap.appendChild(entry);
    });

    group.appendChild(title);
    group.appendChild(entriesWrap);
    listArea.appendChild(group);
  });

  listArea.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSession(btn.dataset.id);
    });
  });
}

function dailyTotalMins(dateStr){
  return segmentsForDay(dateStr).reduce((sum,s) => sum + (s.endMin - s.startMin), 0);
}

function sessionsStartingOn(dateStr){
  return sessions.filter(s => s.startISO.slice(0,10) === dateStr);
}

function computeTrends(){
  const today = todayStr();
  const thisWindow = [];   // last 7 days including today
  const prevWindow = [];   // the 7 days before that
  for(let i=0;i<7;i++) thisWindow.push(addDays(today, -i));
  for(let i=7;i<14;i++) prevWindow.push(addDays(today, -i));

  const avgMins = (days) => {
    const total = days.reduce((sum,d) => sum + dailyTotalMins(d), 0);
    return total / days.length;
  };

  const thisAvg = avgMins(thisWindow);
  const prevAvg = avgMins(prevWindow);
  const deltaMins = Math.round(thisAvg - prevAvg);

  const totalSessionsThis = thisWindow.reduce((sum,d) => sum + sessionsStartingOn(d).length, 0);
  const avgSessionsPerDay = totalSessionsThis / 7;

  // Longest single stretch that started within the last 7 days
  let longest = null;
  sessions.forEach(s => {
    if(thisWindow.includes(s.startISO.slice(0,10))){
      const dur = computeDuration(s.startISO, s.endISO);
      if(!longest || dur.mins > longest.mins){
        longest = { mins: dur.mins, text: dur.text, dateStr: s.startISO.slice(0,10) };
      }
    }
  });

  // Bedtime consistency: for each day, the session that runs overnight
  // (starts that day, ends the next calendar day)
  const bedtimes = [];
  thisWindow.forEach(d => {
    const overnight = sessionsStartingOn(d).find(s => s.endISO.slice(0,10) !== s.startISO.slice(0,10));
    if(overnight){
      const st = new Date(overnight.startISO);
      bedtimes.push(st.getHours()*60 + st.getMinutes());
    }
  });
  let bedtimeRange = null;
  if(bedtimes.length >= 2){
    const min = Math.min(...bedtimes), max = Math.max(...bedtimes);
    bedtimeRange = `${fmtTime(Math.floor(min/60), min%60)} – ${fmtTime(Math.floor(max/60), max%60)}`;
  }

  return { thisAvg, deltaMins, avgSessionsPerDay, longest, bedtimeRange };
}

function renderTrends(){
  const t = computeTrends();
  const avgH = Math.floor(t.thisAvg/60), avgM = Math.round(t.thisAvg%60);
  const deltaAbs = Math.abs(t.deltaMins);
  const deltaText = t.deltaMins === 0
    ? 'same as the previous week'
    : `${t.deltaMins > 0 ? '▲' : '▼'} ${Math.floor(deltaAbs/60)}h ${pad(deltaAbs%60)}m vs previous week`;

  trendsArea.innerHTML = `
    <div class="trend-grid">
      <div class="trend-stat">
        <div class="trend-label">Avg sleep / day</div>
        <div class="trend-value">${avgH}h ${pad(avgM)}m</div>
        <div class="trend-delta">${deltaText}</div>
      </div>
      <div class="trend-stat">
        <div class="trend-label">Avg sleep periods / day</div>
        <div class="trend-value">${t.avgSessionsPerDay.toFixed(1)}</div>
        <div class="trend-delta">including overnight sleep</div>
      </div>
      <div class="trend-stat">
        <div class="trend-label">Longest stretch</div>
        <div class="trend-value">${t.longest ? t.longest.text : '—'}</div>
        <div class="trend-delta">${t.longest ? fmtDateLabel(t.longest.dateStr).dow + ' ' + fmtDateLabel(t.longest.dateStr).md : 'not enough data yet'}</div>
      </div>
      <div class="trend-stat">
        <div class="trend-label">Bedtime range</div>
        <div class="trend-value">${t.bedtimeRange ? t.bedtimeRange : '—'}</div>
        <div class="trend-delta">${t.bedtimeRange ? 'earliest – latest this week' : 'not enough data yet'}</div>
      </div>
    </div>
  `;
}

function render(){
  renderChart();
  renderList();
  renderTrends();
}

$('timer-btn').addEventListener('click', () => {
  if(activeSession){ stopSleep(); } else { startSleep(); }
});

$('add-btn').addEventListener('click', addManualSession);

$('manual-toggle').addEventListener('click', () => {
  const panel = $('manual-panel');
  const opening = panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  $('manual-toggle').textContent = opening ? '– Hide manual entry' : '+ Add manually instead';
  if(opening){
    // Refresh defaults each time it's opened, so the date is correct even
    // if the page has been sitting open since before midnight.
    resetManualForm();
  }
});

resetManualForm();
renderTodayLine();
setInterval(renderTodayLine, 60000);

loadSessions();
</script>
